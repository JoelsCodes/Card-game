es and its left and right sides. <b>Reclash</b> (2 AP) turns one of your cards 180° permanently, then that card fights its neighbours again; only those fights happen again. Revive, Smoke Bomb, Bomb, Trap, Scout, Remedy, Draw, Bolt, Flip and Reclash must be unlocked from the Unlocks menu, and you bring up to 3 items to a match from the item belt on the deck screen. The health bars at the top show how far each side has fallen: a side’s bar drops as the other side scores points.</p>${RULES.map(r=>`<p><b>${r}</b><br><span class="sub">${RD[r]}</span></p>`).join('')}`;

function explode(G){const hit=[];let again=true;while(again){again=false;G.board.forEach((e,j)=>{if(e&&e.c&&e.hp<=0&&G.cmd&&G.cmd[e.who]==='ifrit'&&!G.ipas[e.who]){G.ipas[e.who]=1;again=true;const hq=nbrs(G,j).filter(q=>{const f=G.board[q];return f&&f.c&&!f.sm});G.ifx={src:j,hit:hq.slice(),t:Date.now()};toast((e.who==='p'?'Your':S.opp.n+'’s')+' Ifrit: '+e.c.n+' explodes! Hits: '+(hq.map(q=>G.board[q].c.n).join(', ')||'nothing')+'.');hq.forEach(q=>{const f=G.board[q];f.hp-=1;hit.push(q)})}})}return hit}
function canOd(G,w){const k=G.cmd&&G.cmd[w];if(!k||G.od[w]||G.over||G.busy||G.turn!==w)return false;if(k==='ifrit')return odTargets(G,w).length>0;if(k==='choco')return G.board.some(x=>x&&x.c&&x.who===w&&x.hp<hpOf(x.c));return true}
function odApply(G,w,t){const k=G.cmd[w],who=w==='p'?'You':S.opp.n;odCine(k,w);

else if(k==='choco'){const hit=[];G.board.forEach((e,j)=>{if(e&&e.c&&e.who===w&&e.hp<hpOf(e.c)){e.hp++;hit.push(j)}});G.flash=hit;G.fxm={i:hit,t:Date.now()};toast(who+': Choco Overdrive! +1 HP');G.ilog=who+' used Choco’s Overdrive (+1 HP to '+hit.length+' card'+(hit.length===1?'':'s')+').'}

function aiCmd(G){const k=G.cmd.o;if(!k||G.od.o||!canOd(G,'o'))return;const B=G.board;let go=false,t=0;
if(k==='ifrit'){const ts=odTargets(G,'o').filter(i=>B[i].who==='p'),kl=ts.filter(i=>B[i].hp<=3).sort((a,b)=>sum(B[b].c)-sum(B[a].c));if(kl.length){go=true;t=kl[0]}else if(ts.length&&B.filter(x=>!x).length<=4){go=true;t=ts.sort((a,b)=>B[b].hp-B[a].hp)[0]}}

const ensureP=()=>{P.bro=P.bro||{c:0,t:7+Math.floor(Math.random()*4),vis:0,left:0,stock:[]};if(BROKER_ALWAYS&&!P.bro.vis){P.bro.vis=1;P.bro.left=99;P.bro.mood=P.bro.mood||'hello';if(!P.bro.stock||!P.bro.stock.length)P.bro.stock=brokerStock()};P.mats=(P.mats||[]).filter(k=>MATS.some(m=>m.k===k));if(P.mat!=null&&!P.mats.includes(P.mat))P.mat=null;if(P.beat)P.beat=P.beat.map(n=>n==='Moogle'?'Wildborn Rog':n==='Bartz'?'The Orions':n);P.unl=P.unl||['potion'];if(!P.unl.includes('potion'))P.unl.push('potion');P.prog=P.prog||{};if(P.sel===undefined)P.sel=null;if(P.sel&&P.unl.includes(P.sel))P.sel=null;if(!P.sel)P.sel=(!(P.mc>0)&&!P.unl.includes('revive'))?'revive':unlPick();P.cm=(P.cm||[]).slice(0,5);while(P.cm.length<5)P.cm.push(null);P.cm=P.cm.map(k=>k&&CMD[k]&&P.unl.includes(k)?k:null);P.dk=P.dk>=0&&P.dk<5?P.dk:0;P.belt=(P.belt||['potion']).filter(k=>P.unl.includes(k)).slice(0,bmax());P.decks=P.decks||[];while(P.decks.length<5)P.decks.push([]);P.decks=P.decks.slice(0,5).map(d=>(d||[]).filter(id=>coll[id]>0));P.dk=P.dk>=0&&P.dk<5?P.dk:0};

function beltH(){const b=P.belt;return `<h2>Item belt (${b.length}/${bmax()})</h2><p class="sub">Choose up to ${bmax()} items to bring into the match. Unlock more from the main menu.</p><div class="row" style="flex-wrap:wrap">${Object.keys(ITEMS).map(k=>unlocked(k)?`<button class="chip ${b.includes(k)?'pri':''}" onclick="beltTog('${k}')">${ITEMS[k].n} · ${ITEMS[k].ap} AP</button>`:`<button class="chip" disabled>${ITEMS[k].n} (locked)</button>`).join('')}</div>`}

const remedyOk=x=>!!(x.c&&x.c.tv&&x.c.v.some((v,i)=>v<x.c.tv[i]));
function itemTargets(G,w,k){if(k==='od')return odTargets(G,w);if(k==='revive')return G.grave[w].map((_,i)=>i);if(k==='bomb')return G.board.map((x,i)=>x&&x.b?-1:i).filter(i=>i>=0);if(k==='trap')return G.traps[w]==null?G.board.map((x,i)=>x?-1:i).filter(i=>i>=0):[];if(k==='scout')return G.hands[w==='p'?'o':'p'].some(c=>!G.open.has(c.id))?[0]:[];if(k==='draw')return G.decks[w].length?[0]:[];if(k==='flip'||k==='reclash')return G.board.map((x,i)=>x&&x.c&&x.who===w?i:-1).filter(i=>i>=0);if(k==='bolt')return G.board.map((x,i)=>x&&x.c&&x.who!==w&&!x.sm?i:-1).filter(i=>i>=0);if(k==='remedy')return G.board.map((x,i)=>x&&x.c&&x.who===w&&remedyOk(x)?i:-1).filter(i=>i>=0);return G.board.map((x,i)=>x&&x.c&&x.who===w&&(k==='potion'?x.hp<hpOf(x.c):!x.sm)?i:-1).filter(i=>i>=0)}
function canItem(G,w,k){return !G.over&&!G.busy&&vdelay(G)===0&&G.turn===w&&!G.used[w]&&G.items[w][k]>0&&G.ap[w]>=ic(G,w,k)&&itemTargets(G,w,k).length>0}
function applyItem(G,w,k,t){let d;if(k==='potion'){const e=G.board[t],b4=e.hp;e.hp=Math.min(hpOf(e.c),e.hp+3);const n=e.hp-b4;G.flash=[t];G.fx={i:t,k:'heal',n,t:Date.now()};G.hfx={i:t,n,t:Date.now()};toast((w==='p'?'You':S.opp.n)+': Potion +'+n+' HP');d='used a Potion on '+e.c.n+' (+'+n+' HP).'}
else if(k==='smoke'){const e=G.board[t];e.sm=1;G.flash=[t];G.fx={i:t,k:'smoke',t:Date.now()};toast((w==='p'?'You':S.opp.n)+': Smoke Bomb!');d='threw a Smoke Bomb on '+e.c.n+'.'}
else if(k==='bomb'){const cl=G.cols,cr=[t];if(t%cl>0)cr.push(t-1);if(t%cl<cl-1)cr.push(t+1);if(t-cl>=0)cr.push(t-cl);if(t+cl<G.board.length)cr.push(t+cl);const hit=[];cr.forEach(j=>{const e=G.board[j];if(e&&e.c&&!e.sm){dcr(G,w,e,1);e.hp-=1;hit.push(j)}});G.flash=hit;G.blast={k:'bomb',i:t,sq:cr.slice(),hit:hit.slice(),t:Date.now()};shakeBoard('bomb');blastScreen('bomb');vwait(G,1700);toast((w==='p'?'You':S.opp.n)+': Bomb!');d='dropped a Bomb on square '+(t+1)+' ('+hit.length+' card'+(hit.length===1?'':'s')+' hit).';reap(G)}

else if(k==='flip'){if(w==='p')(G.mg=G.mg||{fx:0,clr:0,beh:0,n:0}).fx++;const e=G.board[t];e.c=flipSides(e.c);G.flash=[t];toast((w==='p'?'You':S.opp.n)+': Flip! '+e.c.n+' turned 180°');d='turned '+e.c.n+' 180° (sides swapped).'}else if(k==='reclash'){if(w==='p')(G.mg=G.mg||{fx:0,clr:0,beh:0,n:0}).fx++;const e=G.board[t];e.c=flipSides(e.c);G.flash=[t];toast((w==='p'?'You':S.opp.n)+': Reclash!');const x=clash(G.board,t,e.c,w,G.mod,G.rules);if(x.list&&x.list.length&&!matchMedia('(prefers-reduced-motion: reduce)').matches)duelFx(G,x,false,w);for(const j in x.d){dcr(G,w,G.board[j],x.d[j]);G.board[j].hp-=x.d[j]}if(x.self)e.hp-=x.self;vwait(G,1700);d='turned '+e.c.n+' 180° and fought again.';reap(G)}else if(k==='bolt'){const e=G.board[t];dcr(G,w,e,2);e.hp-=2;G.flash=[t];G.blast={k:'bolt',i:t,sq:[t],hit:[t],t:Date.now()};shakeBoard('bolt');blastScreen('bolt');vwait(G,1700);toast((w==='p'?'You':S.opp.n)+': Bolt!');d='struck '+e.c.n+' with Bolt (-2 HP).';reap(G)}
else if(k==='remedy'){const e=G.board[t];e.c={...e.c,v:e.c.tv};delete e.c.tv;e.hp=Math.min(hpOf(e.c),e.hp+2);G.flash=[t];G.fx={i:t,k:'heal',n:2,t:Date.now()};toast((w==='p'?'You':S.opp.n)+': Remedy!');d='cleansed '+e.c.n+'.'}

G.ap[w]-=ic(G,w,k);G.items[w][k]--;G.used[w]=true;G.item=null;G.note='';G.ilog=(w==='p'?'You ':S.opp.n+' ')+d;itemX(G,w)}

function aiItems(G){if(G.used.o||G.over)return;if(G.mode==='dom'&&domItems(G))return;const it=G.items.o,ap=G.ap.o+(G.disc&&G.disc.o?1:0),B=G.board,own=B.map((x,i)=>x&&x.c&&x.who==='o'?i:-1).filter(i=>i>=0);
const dm=own.filter(i=>B[i].hp<hpOf(B[i].c)).sort((a,b)=>B[a].hp/hpOf(B[a].c)-B[b].hp/hpOf(B[b].c));let k=null,t=null;

function bigSel(BP,G,t){const A=G.mgA?t-G.mgA:1e9,B=G.mgB?t-G.mgB:1e9;let set='idle',i=Math.floor(t/260)%4;
if(G.over){const k=S.res&&S.res.k;if(k==='win'){set='down';i=0}else if(k==='lose'){set='slash';i=4}}
else if(A<650){set='throw';i=Math.min(5,Math.floor(A/110))}
else if(G.mgH&&A<1500){set='slash';i=Math.min(5,Math.floor((A-650)/140))}
else if(B<700){set='hurt';i=Math.floor(B/230)%3}
else if(G.turn==='o'){set='stance';i=Math.floor(t/220)%4}
if(BP.br&&set==='idle')i=0;
return[set,i]}
function mgTick(){const b=document.getElementById('mgbox');const G=S.G,t=Date.now();
const on=b&&G&&S.screen==='game'&&S.opp&&(SPRS[S.opp.n]||BIG[S.opp.n]);
if(!on){const e=document.getElementById('mg');if(e)e.remove();return}
const pp=scr(G,'p'),oo=scr(G,'o');const SP=SPRS[S.opp.n];
const BP=BIG[S.opp.n];if(BP){const[set,i]=bigSel(BP,G,t);
let el=document.getElementById('mg');if(!el){el=document.createElement('img');el.id='mg';el.alt=S.opp.n;el.style.cssText='width:'+Math.round(BP.w*.88)+'px;height:'+Math.round(BP.h*.88)+'px;flex:none'+(BP.fl?';transform:scaleX(-1)':'')+(BP.ml?';margin-left:-'+BP.ml+'px':'')+(BP.gw?';--mgw:'+BP.gw+'px':'');b.appendChild(el)}
if(el.parentNode!==b)b.appendChild(el);if(el.dataset.f!==set+i){el.dataset.f=set+i;el.src=BP[set][i]}el.classList.toggle('br',!!(BP.br&&set==='idle'));el.style.visibility=duelOn()?'hidden':'';return}
const pick=(a,ms)=>a[Math.floor(t/ms)%a.length];let fr;
if(G.over)fr=pick(S.res&&S.res.k==='win'?SP.hurt:SP.win,400);
else if(G.mgA&&t-G.mgA<900)fr=pick(SP.place,150);
else if(oo>pp)fr=pick(SP.win,400);else if(oo<pp)fr=pick(SP.hurt,400);
else fr=pick(SP.idle,350);
let el=document.getElementById('mg');
if(!el){el=document.createElement('img');el.id='mg';el.alt=S.opp.n;el.style.cssText='width:48px;height:60px;flex:none;image-rendering:pixelated;animation:mgb .5s ease-in-out infinite alternate';b.appendChild(el)}
if(el.parentNode!==b)b.appendChild(el);
if(el.src!==fr)el.src=fr;el.style.visibility=duelOn()?'hidden':''}
setInterval(mgTick,150);
if(P.bm&&BM[P.bm])BGM.src=BM[P.bm];bgmSync();
</script>
