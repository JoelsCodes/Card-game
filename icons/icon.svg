<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#232a52"/><stop offset=".6" stop-color="#121633"/><stop offset="1" stop-color="#0a0d22"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c2"/><stop offset=".35" stop-color="#e9c46a"/><stop offset=".7" stop-color="#b88a1e"/><stop offset="1" stop-color="#7a5a12"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f9ab8"/><stop offset=".5" stop-color="#f3f5ff"/><stop offset="1" stop-color="#9aa4c4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd76a" stop-opacity=".35"/><stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="190" fill="url(#glow)"/>
  <!-- back card -->
  <g transform="rotate(-12 256 270)">
    <rect x="166" y="138" width="180" height="236" rx="18" fill="#161b3c" stroke="url(#gold)" stroke-width="7" opacity=".85"/>
  </g>
  <!-- front card -->
  <g transform="rotate(9 256 270)">
    <rect x="166" y="138" width="180" height="236" rx="18" fill="#1b2147" stroke="url(#gold)" stroke-width="9"/>
    <rect x="184" y="156" width="144" height="200" rx="10" fill="none" stroke="#e9c46a" stroke-opacity=".45" stroke-width="3"/>
  </g>
  <!-- sword -->
  <g>
    <path d="M256 96 L270 130 L270 330 L256 352 L242 330 L242 130 Z" fill="url(#steel)" stroke="#2a2f52" stroke-width="3"/>
    <path d="M256 104 L256 340" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/>
    <rect x="200" y="330" width="112" height="18" rx="9" fill="url(#gold)" stroke="#5a420c" stroke-width="3"/>
    <rect x="247" y="348" width="18" height="52" rx="6" fill="#3a2a10" stroke="#5a420c" stroke-width="3"/>
    <circle cx="256" cy="412" r="16" fill="url(#gold)" stroke="#5a420c" stroke-width="3"/>
  </g>
</svg>
